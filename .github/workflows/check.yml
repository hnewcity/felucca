name: Check and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm --prefix apps/admin ci
      - run: npm --prefix apps/admin run lint
      - run: npm --prefix apps/admin test
      - run: npm --prefix apps/admin run build
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: sh scripts/cargo-external.sh fmt --all --check
      - run: sh scripts/cargo-external.sh clippy --workspace --all-targets --locked -- -D warnings
      - run: sh scripts/cargo-external.sh test --workspace --locked
      - run: sh scripts/cargo-external.sh build --release --locked -p felucca-cli --bins
      - run: python scripts/package.py --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: felucca-${{ matrix.runner }}
          path: dist/*
          if-no-files-found: error
  agent-bundle:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: felucca-*
          path: native-packages
          merge-multiple: true
      - name: Assemble matching clients for every server platform
        run: |
          python3 scripts/bundle-agents.py native-packages/*.tar.gz native-packages/*.zip --output dist/agents
          tar -C dist -czf dist/felucca-agents.tar.gz agents
          cd dist
          sha256sum felucca-agents.tar.gz > felucca-agents.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: felucca-agents
          path: dist/felucca-agents.tar.gz*
          if-no-files-found: error
  minimum-rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: npm --prefix apps/admin ci
      - run: npm --prefix apps/admin run build
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.88.0
      - run: sh scripts/cargo-external.sh check --workspace --all-targets --locked
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build --target server --tag felucca-server:test .
      - run: docker build --target agent --tag felucca-agent:test .
      - run: docker run --rm felucca-server:test --build-info
      - run: docker run --rm felucca-agent:test --build-info
  desktop:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, windows-2022]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --check
        working-directory: apps/desktop/src-tauri
      - run: npm run build
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      - run: cargo test --locked
        working-directory: apps/desktop/src-tauri
      # Unsigned installers: macOS Gatekeeper and Windows SmartScreen will warn
      # until the release workflow signs them.
      - run: npx tauri build --ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: felucca-desktop-${{ matrix.runner }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
