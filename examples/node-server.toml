# 外部平台管理示例。运行前替换示例密码哈希、平台令牌和签名密钥。
# 示例管理密码：change-this-password；用 felucca-server --hash-password 更换。
[bridge]
bind = "127.0.0.1:14028"

[admin]
bind = "127.0.0.1:8990"
state_path = "state/node-config.json"

[admin.account.root]
role = "admin"
password_hash = "pbkdf2-sha256$600000$f1e2d3c4b5a69788796a5b4c3d2e1f00$8211d82084b98d13302553691bbfdc45da910a192a52a5a50ebd682d08a20bae"

[state]
path = "state/node-traffic.json"
save_interval = "5s"

[user.office]

[client.office]
user = "office"
vkey = "replace-with-a-random-client-key"
quota = { flow_limit = 1073741824 }

[node]
id = "edge-a"
state_path = "state/node-events.json"
changes_window = 1024
usage_interval = "10s"
traffic_report_interval = "1s"
traffic_report_step_bytes = 10485760

[node.platform.panel]
enabled = true
token = "replace-with-a-random-platform-token"
scope = "account"
user = "office"
mode = "direct"
# 要让节点主动连接平台，改为 mode = "reverse" 或 "dual" 并设置：
# reverse_url = "wss://panel.example/felucca"
# heartbeat = "15s"
# trust = { mode = "pinned", fingerprint = "<SHA256>" }

# 独立回调示例默认停用；填写真实 HTTPS 地址及随机签名密钥后启用。
[node.webhook.events]
user = "office"
[node.webhook.events.delivery]
enabled = false
url = "https://panel.example/felucca/events"
signing_key = "replace-with-a-random-callback-signing-key"
timeout = "5s"
retry_max = 2
retry_backoff = "2s"
queue_max = 100
