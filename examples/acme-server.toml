[bridge]
bind = "0.0.0.0:14028"
tls = { cert = "conf/bridge.pem", key = "conf/bridge.key" }

[http]
# Map public TCP 80 -> 8080 and 443 -> 8443, or change to :80/:443.
bind = "0.0.0.0:8080"
tls_bind = "0.0.0.0:8443"

[http.acme]
email = "owner@example.com"
# Example only: read and accept your CA's terms before enabling issuance.
accept_tos = true
staging = true
cache_dir = "conf/acme-staging"
# For production set staging = false and use conf/acme-production instead.
# Empty domains derives exact (non-wildcard) hosts from registered agent routes.
domains = ["app.example.com"]
renew_before = "30d"

[client.agent-1]
vkey = "change-me-to-a-long-random-string"
allow_config_push = true
