# The desktop client is its own workspace: Tauri needs Rust 1.90 and a system
# webview, neither of which the server and command-line builds should inherit.
[workspace]

[package]
name = "felucca-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
description = "felucca tray client for macOS and Windows"
publish = false

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "warn"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
felucca-core = { path = "../../../crates/felucca-core" }
felucca-client = { path = "../../../crates/felucca-client" }
felucca-i18n = { path = "../../../crates/felucca-i18n" }
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sys-locale = "0.3.2"
tokio = { version = "1.53.1", features = ["sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.26.1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
